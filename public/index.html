<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OsCodeVideo — Koddan Video Üret</title>
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
  <header>
    <div class="logo">🎬 OsCode<span>Video</span></div>
    <span class="tagline">koddan video üret</span>
  </header>

  <main>
    <section class="stage">
      <canvas id="renderCanvas"></canvas>
      <video id="previewVideo" controls playsinline hidden></video>
      <div class="progress-bar" id="progressBar" hidden>
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="chat" id="chatLog">
      <div class="bot-msg" id="welcomeMsg">
        <div class="avatar">🤖</div>
        <div class="bubble">
          Merhaba! Kodunu yaz, sana video yapayım.<br />
          <small>
            <code>t</code> değişkeni 0'dan 1'e gider.<br />
            <code>daire(x,y,r,renk)</code>
            <code>dikdortgen(x,y,w,h,renk)</code>
            <code>yazi(metin,x,y,boyut,renk)</code>
            <code>cizgi(x1,y1,x2,y2,renk,kalinlik)</code>
            <code>arkaplan(renk)</code><br />
            Süre: en üste <code>@5s</code> yaz (max 30 sn).
          </small>
        </div>
      </div>
    </section>

    <section class="input-area">
      <textarea id="codeInput" spellcheck="false">@5s
const x = 100 + t * 900;
daire(x, 360, 50, "#ff6b35");</textarea>
      <div class="actions">
        <div class="examples">
          <span>Örnekler:</span>
          <button data-ex="0">Top</button>
          <button data-ex="1">Zıplayan</button>
          <button data-ex="2">Yazı</button>
          <button data-ex="3">Renk</button>
          <button data-ex="4">Kare</button>
        </div>
        <button id="generateBtn" class="primary">⚡ Videoyu Oluştur</button>
      </div>
    </section>

    <section class="result" id="resultSection" hidden>
      <a id="downloadBtn" class="primary download" download>⬇️ Videoyu İndir</a>
    </section>
  </main>

  <script src="app.js?v=8"></script>
</body>
</html>
